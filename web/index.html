<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NutriBells - Aplikasi kesehatan dan nutrisi.">
  <meta name="theme-color" content="#800020">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NutriBells">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>NutriBells</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #4A0012; }

    /* Layar loading bertema maroon, tampil sampai frame pertama Flutter siap */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #A8284A 0%, #800020 50%, #4A0012 100%);
      color: #fff;
      font-family: Roboto, Arial, sans-serif;
      transition: opacity 0.6s ease;
    }
    #loader.hide { opacity: 0; pointer-events: none; }

    .pulse {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pulse img {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
      animation: float 2.4s ease-in-out infinite;
    }
    .pulse::before, .pulse::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      animation: ripple 2s ease-out infinite;
    }
    .pulse::after { animation-delay: 1s; }

    @keyframes ripple {
      from { transform: scale(0.7); opacity: 1; }
      to   { transform: scale(1.9); opacity: 0; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    #loader h1 {
      margin: 28px 0 4px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1.2px;
    }
    #loader p { margin: 0; font-size: 13px; opacity: 0.8; }

    .dots { display: flex; gap: 8px; margin-top: 26px; }
    .dots i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dots i:nth-child(2) { animation-delay: 0.15s; }
    .dots i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <div id="loader">
    <div class="pulse"><img src="logo_loading.png" alt="NutriBells"></div>
    <h1>NutriBells</h1>
    <p>Sehat dimulai dari kebiasaan kecil</p>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>

  <script>
    // Sembunyikan layar loading setelah frame pertama Flutter tampil
    (function () {
      var loader = document.getElementById('loader');
      function hide() {
        if (!loader) return;
        var el = loader;
        loader = null;
        el.classList.add('hide');
        setTimeout(function () { el.remove(); }, 700);
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 20000); // jaga-jaga agar loading tidak menutupi layar selamanya
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
